[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recursion-claim-audit"
version = "0.1.0"
description = "Audit documented directory traversal depth against Python source."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
recursion-claim-audit = "recursion_claim_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
